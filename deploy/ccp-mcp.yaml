# ccp-mcp：CCP 平台的 MCP 网关（独立项目）
#
# 与 ccp-backend 的关系：令牌库自有（PG 或 PVC 落盘）；工具调用经 HTTP 打到
# ccp-backend（Service ccp-backend:8010），每条调用一换一铸 5 分钟 session，
# 以令牌属主身份跑——权限 / 可见范围 / 计费拦截与控制台同一套。
apiVersion: apps/v1
kind: Deployment
metadata:
  name: ccp-mcp
  namespace: ccp-system
spec:
  # PG 模式（2026-10-18）读写直查库，多副本不再丢更新——回到 2 副本
  replicas: 2  # 令牌库 JSON 落盘 + NFS mtime 同步挡不住写-写竞争（丢更新），单副本最稳；MCP 认证流量小，可用性损失可忽略
  selector:
    matchLabels: { app: ccp-mcp }
  template:
    metadata:
      labels: { app: ccp-mcp }
    spec:
      containers:
        - name: ccp-mcp
          image: reg.hpcweb.cc/ccp/ccp-mcp:v1.0.0
          ports:
            - containerPort: 8020
              name: http
          env:
          # 令牌库走 PG（与 ccp-backend 同库；mcp_tokens 表）。没配则回落 JSON 文件 / 内存
          - name: CCP_MCP_DATABASE_URL
            value: "postgresql+psycopg://ccp:$(PGPASSWORD)@ccp-postgres:5432/ccp"
            - name: CCP_MCP_BACKEND
              value: "http://ccp-backend.ccp-system.svc:8010"
            - name: CCP_MCP_INTERNAL_KEY
              valueFrom:
                secretKeyRef:
                  name: ccp-internal-key
                  key: key
                  optional: false
            - name: CCP_MCP_DATA_PATH
              value: "/data/tokens.json"
          volumeMounts:
            - name: data
              mountPath: /data
          readinessProbe:
            httpGet: { path: /healthz, port: 8020 }
          livenessProbe:
            httpGet: { path: /healthz, port: 8020 }
      volumes:
        - name: data
          persistentVolumeClaim: { claimName: ccp-mcp-data }
---
apiVersion: v1
kind: Service
metadata:
  name: ccp-mcp
  namespace: ccp-system
spec:
  selector: { app: ccp-mcp }
  ports:
    - name: http
      port: 8020
      targetPort: 8020
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: ccp-mcp-data
  namespace: ccp-system
spec:
  accessModes: [ReadWriteOnce]
  resources:
    requests: { storage: 100Mi }
